# Релиз Astreya Gate: push тега `v*` → сборка установщика + артефакты
# автообновления (latest.json + .sig) публикуются в GitHub Releases.
#
# ОДНОКРАЙНЯЯ НАСТРОЙКА (секреты репозитория → Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY:            содержимое файла ~/.tauri/astreya-gate.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD:   пустая строка (ключ без пароля)
#
# Как выпустить версию:
#   1) поднять version в package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml
#   2) git commit && git tag v1.0.1 && git push origin v1.0.1
# Установленные приложения увидят апдейт в течение суток (или по кнопке «Проверить»).

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            bridge

      - name: Install frontend deps
        run: npm ci

      - name: Build bridge
        run: npm run bridge:build

      - name: Download sing-box engine
        shell: pwsh
        run: |
          # Пин версии + прямая ссылка: не ходим в api.github.com —
          # на раннерах он регулярно упирается в rate limit (60/ч на IP).
          $ver = "1.13.19"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$ver/sing-box-$ver-windows-amd64.zip"
          Write-Host "sing-box: $url"
          Invoke-WebRequest $url -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath singbox-tmp -Force
          $exe = Get-ChildItem singbox-tmp -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri/resources/sing-box.exe -Force

      - name: Download wintun driver (TUN mode)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-tmp -Force
          Copy-Item wintun-tmp/wintun/bin/amd64/wintun.dll src-tauri/resources/wintun.dll -Force

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"            # v1.2.3
          $ver = $tag.TrimStart("v")
          $notes = New-Object System.Collections.Generic.List[string]
          $capture = $false
          foreach ($l in (Get-Content CHANGELOG.md -Encoding UTF8)) {
            if ($l -match "^##\s+\[$ver\]") { $capture = $true; continue }
            if ($capture -and $l -match "^##\s+\[") { break }
            if ($capture) { $notes.Add($l) }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { $text = "Astreya Gate $ver — смотрите список изменений в CHANGELOG.md." }
          "RELEASE_NOTES<<EOF`n$text`nEOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Заметки ($($text.Length) симв.): $($text.Substring(0, [Math]::Min(80, $text.Length)))..."

      - name: Build & publish app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Astreya Gate ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
